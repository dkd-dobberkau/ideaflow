name: Build & Deploy strfry Relay

on:
  push:
    branches: [main]
    paths:
      - "strfry.conf"
      - "deploy/mittwald/Dockerfile.strfry"
      - "deploy/mittwald/docker-compose.yml"
      - ".github/workflows/deploy-strfry.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ideaflow-strfry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mittwald/Dockerfile.strfry
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Mittwald
        uses: mittwald/deploy-container-action@v1
        env:
          # strfry
          STRFRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # garage
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          GARAGE_ADMIN_TOKEN: ${{ secrets.GARAGE_ADMIN_TOKEN }}
          # admin
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DOMAIN: ${{ vars.STATICPUB_DOMAIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATICPUB_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATICPUB_AWS_SECRET_ACCESS_KEY }}
          ADMIN_USER: ${{ secrets.STATICPUB_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.STATICPUB_ADMIN_PASSWORD }}
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          stack_id: ${{ vars.MITTWALD_STACK_ID }}
          stack_file: deploy/mittwald/docker-compose.yml
          skip_recreation: "garage,admin"
